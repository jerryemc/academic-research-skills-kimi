name: sync-upstream

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Clone ARS-Codex upstream
        run: |
          git clone --depth 1 https://github.com/Imbad0202/academic-research-skills-codex.git /tmp/ars-codex
          NEW_SHA=$(git -C /tmp/ars-codex rev-parse HEAD)
          OLD_SHA=$(cat .upstream-commit 2>/dev/null || true)
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "old_sha=$OLD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: source

      - name: Skip unchanged upstream
        if: steps.source.outputs.changed == 'false'
        run: echo "Already at $OLD_SHA; no sync branch or PR is needed."

      - name: Synchronize content and generate Skill entries
        if: steps.source.outputs.changed == 'true'
        run: |
          python tools/kimi-sync/sync_ars_codex.py \
            --upstream /tmp/ars-codex \
            --repo-root . | tee /tmp/ars-sync-report.json

      - name: Run sync and plugin checks
        if: steps.source.outputs.changed == 'true'
        run: |
          python -m pytest tools/kimi-sync/tests -v
          python tools/kimi-sync/validate_plugin.py .

      - name: Commit sync branch
        if: steps.source.outputs.changed == 'true'
        env:
          NEW_SHA: ${{ steps.source.outputs.new_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="sync/ars-codex-${NEW_SHA::7}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Upstream metadata changed but produced no file diff; nothing to publish."
            exit 0
          fi
          git commit -m "Sync ARS-Codex @ $NEW_SHA"
          git push --force-with-lease origin "$BRANCH"
        id: publish

      - name: Create or update review PR
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_SHA: ${{ steps.source.outputs.new_sha }}
          OLD_SHA: ${{ steps.source.outputs.old_sha }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          SOURCE_VERSION=$(jq -r '.source_version' /tmp/ars-sync-report.json)
          ADDED=$(jq -c '.added_workflows' /tmp/ars-sync-report.json)
          REMOVED=$(jq -c '.removed_workflows' /tmp/ars-sync-report.json)
          {
            echo "Sync ARS-Codex from \`$OLD_SHA\` to \`$NEW_SHA\`."
            echo
            echo "- Upstream version: \`$SOURCE_VERSION\`"
            echo "- Added workflows (report only): \`$ADDED\`"
            echo "- Removed workflows: \`$REMOVED\`"
            echo "- \`python -m pytest tools/kimi-sync/tests -v\`: passed"
            echo "- \`python tools/kimi-sync/validate_plugin.py .\`: passed"
            echo
            if [ "$ADDED" != "[]" ]; then
              echo "**Review required:** new upstream workflows were not registered. Update \`tools/kimi-sync/ars_workflows.json\` deliberately before exposing them."
              echo
            fi
            echo "Hooks, commands, and agents remain unregistered. Do not auto-merge; verify Kimi Code Desktop before publishing."
          } > /tmp/ars-sync-pr.md
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "Sync ARS-Codex @ ${NEW_SHA::7}" \
              --body-file /tmp/ars-sync-pr.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync ARS-Codex @ ${NEW_SHA::7}" \
              --body-file /tmp/ars-sync-pr.md
          fi
